<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Times New Roman, serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d21"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/>
    </marker>
  </defs>
  <polygon points="20,220 350,220 350,99.9" fill="#e6edf3" stroke="#1a1d21" stroke-width="2"/>
  <path d="M60,220 A40,40 0 0 0 57.6,206.3" fill="none" stroke="#1a1d21" stroke-width="1.5"/>
  <text x="64" y="216" font-size="16" font-style="italic">θ</text>
  <rect x="0" y="-96" width="26" height="96" fill="#ffffff" stroke="#1a1d21" stroke-width="2" transform="translate(85.8,196.1) rotate(-20)"/>
  <circle cx="81.6" cy="146.5" r="3" fill="#1a1d21"/>
  <text x="85.6" y="142.5" font-size="13" font-style="italic">G</text>
  <line x1="81.6" y1="146.5" x2="81.6" y2="232.9" stroke="#1f5f8b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="79.8" y="89" font-size="11" font-family="sans-serif">背が高く底が狭い：倒れる</text>
  <rect x="0" y="-34" width="92" height="34" fill="#ffffff" stroke="#1a1d21" stroke-width="2" transform="translate(207.9,151.6) rotate(-20)"/>
  <circle cx="245.4" cy="119.9" r="3" fill="#1a1d21"/>
  <text x="249.4" y="115.9" font-size="13" font-style="italic">G</text>
  <line x1="245.4" y1="119.9" x2="245.4" y2="150.5" stroke="#1f5f8b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="201.9" y="80.2" font-size="11" font-family="sans-serif">低く広い：倒れない</text>
  <text x="16" y="22" font-size="11" font-family="sans-serif" fill="#565d66">破線：G を通る鉛直線（底面の内側に落ちれば倒れない）</text>
  <text x="16" y="38" font-size="11" font-family="sans-serif">転倒の限界 tanθ = L/H<tspan font-size="9" dy="3">G</tspan><tspan dy="-3"> </tspan>、滑りの限界 tanθ = μ</text>
  <text x="16" y="54" font-size="11" font-family="sans-serif">L/H<tspan font-size="9" dy="3">G</tspan><tspan dy="-3"> </tspan>&lt; μ なら転倒が先、L/H<tspan font-size="9" dy="3">G</tspan><tspan dy="-3"> </tspan>&gt; μ なら滑りが先</text>
</svg>
