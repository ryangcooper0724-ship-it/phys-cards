<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Times New Roman, serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d21"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/>
    </marker>
  </defs>
  <polygon points="70,190 210,190 274.3,113.4 134.3,113.4" fill="#e6edf3" stroke="#8a929b" stroke-width="1"/>
  <line x1="70" y1="190" x2="210" y2="190" stroke="#1a1d21" stroke-width="2.2" marker-end="url(#ah)"/>
  <line x1="70" y1="190" x2="134.3" y2="113.4" stroke="#1a1d21" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="206" y="210" font-size="18" font-style="italic"><tspan font-weight="bold">a</tspan></text>
  <text x="114.3" y="115.4" font-size="18" font-style="italic"><tspan font-weight="bold">b</tspan></text>
  <path d="M104,190 A34,34 0 0 0 91.9,164" fill="none" stroke="#1a1d21" stroke-width="1.5"/>
  <text x="108" y="180" font-size="17" font-style="italic">θ</text>
  <line x1="134.3" y1="113.4" x2="134.3" y2="190" stroke="#1a1d21" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polyline points="126.3,190 126.3,182 134.3,182" fill="none" stroke="#1a1d21" stroke-width="1"/>
  <text x="139.3" y="145.7" font-size="14" font-style="italic">b sinθ</text>
  <text x="178" y="176" font-size="13" font-family="sans-serif">面積 ab sinθ</text>
  <circle cx="300" cy="64" r="13" fill="#ffffff" stroke="#1a1d21" stroke-width="2"/>
  <circle cx="300" cy="64" r="3.5" fill="#1a1d21"/>
  <text x="274" y="42" font-size="17" font-style="italic"><tspan font-weight="bold">a</tspan>×<tspan font-weight="bold">b</tspan></text>
  <text x="256" y="106" font-size="12" font-family="sans-serif" fill="#565d66">紙面の手前向き</text>
  <path d="M133.6,183.3 A64,64 0 0 0 116,145.5" fill="none" stroke="#1a1d21" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="16" y="30" font-size="12" font-family="sans-serif" fill="#565d66">a から b へ右ねじを回すと、ねじは手前へ進む</text>
  <text x="16" y="236" font-size="12" font-family="sans-serif" fill="#565d66">b のうち a に垂直な成分 b sinθ だけが効く</text>
</svg>
