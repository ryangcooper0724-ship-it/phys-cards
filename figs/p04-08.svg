<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Times New Roman, serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d21"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/>
    </marker>
  </defs>
  <circle cx="92" cy="135" r="72" fill="none" stroke="#1a1d21" stroke-width="1.5"/>
  <circle cx="92" cy="135" r="2.5" fill="#1a1d21"/>
  <text x="76" y="153" font-size="14" font-style="italic">O</text>
  <line x1="92" y1="135" x2="164" y2="135" stroke="#1a1d21" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="92" y1="135" x2="157.8" y2="105.7" stroke="#1a1d21" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M116,135 A24,24 0 0 0 113.9,125.2" fill="none" stroke="#1a1d21" stroke-width="1.2"/>
  <text x="120" y="131" font-size="14" font-style="italic">Δθ</text>
  <line x1="164" y1="135" x2="164" y2="73" stroke="#1a1d21" stroke-width="2" marker-end="url(#ah)"/>
  <text x="169" y="105" font-size="15" font-style="italic"><tspan font-weight="bold">v</tspan>(t)</text>
  <line x1="157.8" y1="105.7" x2="132.6" y2="49.1" stroke="#1a1d21" stroke-width="2" marker-end="url(#ah)"/>
  <text x="92.6" y="43.1" font-size="15" font-style="italic"><tspan font-weight="bold">v</tspan>(t+Δt)</text>
  <line x1="204" y1="26" x2="204" y2="236" stroke="#8a929b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="300" y1="222" x2="300" y2="72" stroke="#1a1d21" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="300" y1="222" x2="239" y2="85" stroke="#1a1d21" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="300" y1="72" x2="239" y2="85" stroke="#1f5f8b" stroke-width="2.5" marker-end="url(#af)"/>
  <path d="M300,188 A34,34 0 0 0 286.2,190.9" fill="none" stroke="#1a1d21" stroke-width="1.2"/>
  <text x="278" y="182" font-size="13" font-style="italic">Δθ</text>
  <text x="306" y="142" font-size="16" font-style="italic">v</text>
  <text x="253.5" y="153.5" font-size="16" font-style="italic">v</text>
  <text x="247.5" y="58" font-size="16" font-style="italic" fill="#1f5f8b">Δ<tspan font-weight="bold">v</tspan></text>
  <text x="212" y="232" font-size="11" font-family="sans-serif" fill="#565d66">始点をそろえる。</text>
  <text x="212" y="246" font-size="11" font-family="sans-serif" fill="#565d66">|Δv| ≒ vΔθ、向きは中心向き</text>
  <text x="10" y="22" font-size="12" font-family="sans-serif" fill="#565d66">Δt の間に速度は Δθ だけ向きを変える</text>
</svg>
