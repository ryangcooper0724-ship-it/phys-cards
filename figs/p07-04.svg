<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Times New Roman, serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d21"/>
    </marker>
  </defs>
  <!-- 床（なめらか） -->
  <line x1="20" y1="200" x2="340" y2="200" stroke="#1a1d21" stroke-width="2"/>
  <g stroke="#8a929b" stroke-width="1">
    <line x1="30" y1="200" x2="22" y2="208"/><line x1="60" y1="200" x2="52" y2="208"/><line x1="90" y1="200" x2="82" y2="208"/>
    <line x1="120" y1="200" x2="112" y2="208"/><line x1="150" y1="200" x2="142" y2="208"/><line x1="180" y1="200" x2="172" y2="208"/>
    <line x1="210" y1="200" x2="202" y2="208"/><line x1="240" y1="200" x2="232" y2="208"/><line x1="270" y1="200" x2="262" y2="208"/>
    <line x1="300" y1="200" x2="292" y2="208"/><line x1="330" y1="200" x2="322" y2="208"/>
  </g>
  <text x="300" y="224" font-size="13" font-family="sans-serif" fill="#565d66">なめらか</text>
  <!-- 楔 M -->
  <polygon points="60,200 60,60 280,200" fill="#e6edf3" stroke="#1a1d21" stroke-width="2"/>
  <text x="66" y="128" font-size="22" font-style="italic">M</text>
  <!-- 傾角 θ -->
  <path d="M240,200 A40,40 0 0 1 246.3,178.5" fill="none" stroke="#1a1d21" stroke-width="1.5"/>
  <text x="216" y="194" font-size="18" font-style="italic">θ</text>
  <!-- 物体 m -->
  <rect x="0" y="-30" width="30" height="30" fill="#ffffff" stroke="#1a1d21" stroke-width="2" transform="translate(148,116) rotate(32.47)"/>
  <text x="161" y="118" font-size="18" font-style="italic">m</text>
  <text x="186" y="96" font-size="15" font-style="italic">(x, y)</text>
  <!-- 楔の位置 X -->
  <line x1="60" y1="200" x2="60" y2="236" stroke="#8a929b" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="24" cy="236" r="2.5" fill="#1a1d21"/>
  <text x="14" y="232" font-size="13" font-style="italic">O</text>
  <line x1="24" y1="236" x2="60" y2="236" stroke="#1a1d21" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="34" y="250" font-size="15" font-style="italic">X</text>
  <!-- 座標の向き -->
  <line x1="292" y1="70" x2="332" y2="70" stroke="#1a1d21" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="292" y1="70" x2="292" y2="30" stroke="#1a1d21" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="336" y="75" font-size="16" font-style="italic">x</text>
  <text x="297" y="32" font-size="16" font-style="italic">y</text>
</svg>
